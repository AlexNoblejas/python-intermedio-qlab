[project]
name = "agente-socioeconomico-peru"
version = "0.1.0"
description = "Tarea 4: agente BCRP MCP + Skills ENAHO 2024"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=4,<5", "httpx>=0.27", "pandas>=2.2", "pyarrow>=17",
  "geopandas>=1.0", "matplotlib>=3.9", "numpy>=1.26",
  "streamlit>=1.39"
]
[dependency-groups]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
testpaths = ["mcp", "tests"]
